[package]
name = "librefood"
version = "0.1.0"
edition = "2021"
description = "Librefood — scan a barcode, look up a detailed product score via Open Food Facts"
license = "MIT"
readme = "README.md"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_46"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Webcam capture + barcode decode (optional at runtime if no camera)
nokhwa = { version = "0.10", features = ["input-native"] }
rxing = "0.5"

[profile.release]
lto = true
codegen-units = 1
