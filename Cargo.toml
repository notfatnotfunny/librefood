[package]
name = "librefood"
version = "0.2.0"
edition = "2021"
description = "Librefood — configurable food scores from Open Food Facts"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_46"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Webcam: raw V4L2 (nokhwa CameraFormat fails on Alpine/ARM musl stacks)
v4l = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rxing = "0.5"

[profile.release]
lto = true
codegen-units = 1
